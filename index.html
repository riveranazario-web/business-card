  <title>Héctor Rivera Nazario — RPM</title>
  <meta name="description" content="Héctor Rivera Nazario, Project Manager at Realty Property Management LLC, Puerto Rico.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #cce0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(38,66,42,0.15);
      animation: fadeUp 0.6s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
      height: 5px;
      background: linear-gradient(90deg, #26422A 0%, #EA672D 55%, #5D372A 100%);
    }

    .card-header {
      background: #D2E8FF;
      padding: 18px 22px 0;
      position: relative;
      overflow: hidden;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .logo-row img {
      height: 54px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tagline { text-align: right; }
    .tagline .t1 {
      font-size: 11px;
      color: rgba(38,66,42,0.55);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 400;
      line-height: 1.5;
    }
    .tagline .t2 {
      font-size: 11px;
      color: #5D372A;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 700;
      line-height: 1.5;
    }

    .profile-row {
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }

    .photo-wrap { flex-shrink: 0; position: relative; }

    .photo-wrap img {
      width: 88px;
      height: 116px;
      object-fit: cover;
      object-position: center 12%;
      border-radius: 10px 10px 0 0;
      display: block;
    }

    .photo-accent { height: 3px; background: #EA672D; }

    .name-block { padding-bottom: 18px; flex: 1; }
    .person-role {
      font-size: 9.5px;
      color: #5D372A;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .person-name {
      font-size: 19px;
      font-weight: 700;
      color: #26422A;
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .person-company {
      font-size: 9px;
      color: rgba(38,66,42,0.5);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .card-body { background: #ffffff; padding: 18px 24px; }

    .contacts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

    .ci { display: flex; align-items: center; gap: 11px; text-decoration: none; transition: opacity 0.2s; }
    .ci:hover { opacity: 0.7; }

    .pill {
      display: flex; align-items: center; gap: 5px;
      background: rgba(234,103,45,0.1);
      border: 0.5px solid rgba(234,103,45,0.4);
      border-radius: 20px;
      padding: 4px 10px 4px 8px;
      flex-shrink: 0; min-width: 70px;
    }
    .pill i { font-size: 12px; color: #EA672D; }
    .pill span { font-size: 9px; color: #EA672D; letter-spacing: 0.5px; font-weight: 600; text-transform: uppercase; }
    .ci-value { font-size: 11.5px; color: #26422A; font-weight: 400; }

    .div { height: 0.5px; background: rgba(38,66,42,0.1); margin: 14px 0; }
    .sec-label { font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: rgba(38,66,42,0.4); margin-bottom: 10px; font-weight: 400; }

    .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 14px; }

    .lbtn {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 11px; border-radius: 9px;
      background: rgba(38,66,42,0.06); border: 0.5px solid rgba(38,66,42,0.18);
      text-decoration: none; transition: background 0.2s;
    }
    .lbtn:hover { background: rgba(38,66,42,0.12); }
    .lbtn.hot { background: rgba(234,103,45,0.09); border-color: rgba(234,103,45,0.3); }
    .lbtn.hot:hover { background: rgba(234,103,45,0.16); }
    .lbtn i { font-size: 15px; color: #EA672D; flex-shrink: 0; }
    .lbtn-text { font-size: 10.5px; color: #26422A; font-weight: 400; line-height: 1.25; }

    .social-row { display: flex; gap: 8px; }

    .schip {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 18px;
      background: #D2E8FF; border: 0.5px solid rgba(38,66,42,0.15);
      text-decoration: none; flex: 1; justify-content: center; transition: background 0.2s;
    }
    .schip:hover { background: #bddaf7; }
    .schip i { font-size: 14px; color: #26422A; }
    .schip span { font-size: 10.5px; color: #26422A; font-weight: 500; }

    .save-btn {
      display: flex; align-items: center; gap: 7px;
      background: #26422A; color: #FFEEBC; border: none;
      padding: 12px 0; border-radius: 18px;
      font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 600;
      cursor: pointer; letter-spacing: 1.5px; text-transform: uppercase;
      width: 100%; justify-content: center; margin-top: 14px; transition: background 0.2s;
    }
    .save-btn:hover { background: #1a2e1d; }

    .card-footer {
      padding: 10px 24px 14px; background: #f0f7ff;
      border-top: 0.5px solid rgba(38,66,42,0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-text { font-size: 8.5px; color: rgba(38,66,42,0.35); letter-spacing: 1px; text-transform: uppercase; }
    .footer-dots { display: flex; gap: 4px; align-items: center; }
    .dot { width: 5px; height: 5px; border-radius: 50%; }
  </style>
</head>
